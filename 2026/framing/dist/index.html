import init, * as bindings from '/framing/dist/game_lib-3c25edac4e9a3f84.js';

    <title>Jam 2026 Framing Device</title>
  <link rel="modulepreload" href="/framing/dist/game_lib-3c25edac4e9a3f84.js" crossorigin="anonymous" integrity="sha384-/c3xUom9xSH9SCAZcjRTaXo6GSFWc4cOKxr+FqqMu8RDWu7NLn0J0OrQKE7Y6lsF"><link rel="modulepreload" href="/framing/dist/snippets/teleia-727bf4351691f1c8/src/helpers.js" crossorigin="anonymous" integrity="sha384-HhtEY2WfGmhyPUSRWKZvqsRxYsdT/DLEdFUqWyDZt6G6lrNHmE1zMlw4BJ3RycRd"><link rel="modulepreload" href="/framing/dist/snippets/game_lib-09da6449fcb9d06e/src/bindings.js" crossorigin="anonymous" integrity="sha384-5OqMgKkpxoyJdg0zjf0uRBl5lKhgxNx4rdX+ML4CRyveCr3dizM3Lbxs58MxUzTz"><link rel="preload" href="/framing/dist/game_lib-3c25edac4e9a3f84_bg.wasm" crossorigin="anonymous" integrity="sha384-+LSmZtknxVkt+J70C0azEmZhgVXpHWAwU1hSq8jBbDeTgCArVCnlTezzGySyZLxG" as="fetch" type="application/wasm"></head>
  <body>
    <script type="module">
      window.addEventListener("TrunkApplicationStarted", async (event) => {
          console.log("initialized, starting...");
          window.wasmBindings.main_js();
      });
      window.addEventListener("message", ev => {
          switch (ev.data.op) {
          case "titlescreenclick":
              window.fetch("https://api.colonq.computer/api/leaderboard/jam2026?n=1").then(async (resp) => {
                  const top = await resp.json();
                  const score = top?.[0]?.[2];
                  if (typeof score === "number") {
                      console.log(`high score: ${score}`);
                      window.wasmBindings.set_leaderboard_highscore(score);
                  }
              });
              window.wasmBindings.titlescreen_click();
              break;
          case "startgame":
              window.wasmBindings.start_game(ev.data.name, ev.data.verb);
              break;
          case "endgame":
              window.wasmBindings.end_game(ev.data.win);
              break;
          case "gameover":
              window.wasmBindings.game_over(ev.data.streak);
              break;
          case "reset":
              window.wasmBindings.reset();
              break;
          default: console.log(`unknown event in framing iframe: ${ev}`); break;
          }
      });
    </script>
    <div id="teleia-parent"></div>
  </body>
</html>
