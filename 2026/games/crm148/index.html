<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>In Between The Iframes</title>
    <style>
      * {
          margin: 0px;
          padding: 0px;
      }
      body {
          font-size: 10px;
      }
      #game-test {
          width: 100%;
          height: 100%;
      }
      .debugStuff {
          display: none;
      }
    </style>
    <script type="module">
      import * as game from './game.js';
      // console.log(window.innerWidth);
      window.addEventListener("message", ev => {
          switch (ev.data.op) {
          case "start":
              game.start(ev.data.difficulty);
              break;
          default: console.log(`unknown event: ${ev}`); break;
          }
      });;
      window.parent.postMessage({op: "ready"});
    </script>
  </head>
  <body>
    <canvas id="gameCanvas" width="240" height="160"></canvas>
    <p class="debugStuff">
      <a href="#" id="startButton">Start</a>
    </p>
    <p class="debugStuff">
      <a href="#" id="testButton">Test</a>
      <a href="#" id="plusButton">+</a>
      <a href="#" id="minusButton">&ndash;</a>
    </p>
    <p id="debugP"></p>
  </body>
</html>
